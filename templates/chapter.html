{% extends 'base.html' %}


{% block title %}
{{ chapter.title }}
{% endblock %}

{% block content %}

<h1>{{chapter.title}}</h1>
<div>{{ content | safe }}</div>
<nav aria-label="Chapter Navigation">
    <div>
    {% if prev_chapter %}
        <a href="{{ url_for('show_chapter', chapter_number=prev_chapter.chapter_number) }}">
        Previous: {{ prev_chapter.title }}</a>
    {% endif %}
    </div>
    <div>
    {% if next_chapter %}
        <a href="{{ url_for('show_chapter', chapter_number=next_chapter.chapter_number) }}">
        Next: {{ next_chapter.title }}</a>
    {% endif %}
    </div>
</nav>
</nav>
{% endblock %}
